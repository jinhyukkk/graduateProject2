llm:
  # 선행연구 동일 백본: DIN-SQL(Pourreza & Rafiei, NeurIPS 2023) /
  # MAC-SQL(Wang et al., COLING 2025)이 모두 vanilla GPT-4를 사용했다.
  # 2023-06 snapshot인 gpt-4-0613은 두 논문 발표 시점의 기본 GPT-4와 동일.
  # 단, 8K context 제약으로 BIRD 큰 스키마에서 일부 샘플 실패 가능.
  model: "gpt-4-0613"
  temperature: 0.0
  max_tokens: 1024

embedding:
  model: "text-embedding-3-large"

schema_linker:
  top_k_tables: 10
  top_k_columns: 30

sql_generator:
  few_shot_k: 3

correction:
  max_rounds: 3
  semantic_threshold: 0.5

self_consistency:
  k: 1   # pilot에서는 SC 비활성 — 비용 추정의 단순화/하한
  temperature: 0.7

nli:
  model: "cross-encoder/nli-deberta-v3-base"

evaluation:
  datasets: ["bird"]
  bird_dev_path: "data/raw/bird/dev.json"   # ← 전체 dev에서 sample하기 위함
  hrdb_dev_path: "data/raw/hrdb/dev_combined.json"
  hrdb_db_path: "data/raw/hrdb/hrdb.sqlite"
  hrdb_metadata_path: "data/raw/hrdb/metadata.json"

baselines:
  dail_sql:
    few_shot_k: 5
    skeleton_sim_threshold: 0.85
  mac_sql:
    max_refine_rounds: 3
    sqlite_timeout: 5.0
    selector_char_threshold: 0
  din_sql:
    max_correction_rounds: 1
    sqlite_timeout: 5.0

output:
  results_dir: "outputs/logs/"
  checkpoint_dir: "outputs/checkpoints/"
